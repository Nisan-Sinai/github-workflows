name: Reusable isolated HTTP load QA
on:
  workflow_call:
    inputs:
      safety-command:
        type: string
        required: true
      build-command:
        type: string
        required: true
      start-command:
        type: string
        required: true
      load-command:
        type: string
        required: true
      node-version:
        type: string
        default: '24'
      working-directory:
        type: string
        default: '.'
permissions:
  contents: read
jobs:
  harness:
    name: Load QA / safety contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Require explicit trusted commands
        env:
          SAFETY: ${{ inputs.safety-command }}
          BUILD: ${{ inputs.build-command }}
          START: ${{ inputs.start-command }}
          LOAD: ${{ inputs.load-command }}
        run: |
          node --input-type=module - <<'NODE'
          for (const name of ['SAFETY', 'BUILD', 'START', 'LOAD']) {
            if (!process.env[name]?.trim()) throw new Error(`${name} command must not be blank`);
          }
          NODE
      - name: Safety, metrics and failure-path tests
        env:
          COMMAND: ${{ inputs.safety-command }}
        run: bash -euo pipefail -c "$COMMAND"
  load:
    name: Load QA / 100 + 200 local users
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholderplaceholderplaceholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SUPABASE_SERVICE_ROLE_KEY: placeholderplaceholderplaceholder
      TOKEN_PEPPER: temporarytokenpeppertemporarytokenpepper
      IP_HASH_PEPPER: temporaryippeppertemporaryippepper
      LOAD_BASE_URL: http://127.0.0.1:3000
      LOAD_USERS: '100,200'
      LOAD_ROUNDS: '3'
      LOAD_TIMEOUT_MS: '30000'
      LOAD_MAX_ERROR_PERCENT: '1'
      LOAD_MAX_P95_MS: '15000'
      LOAD_REPORT_PATH: artifacts/load-test-report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Build isolated application
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Benchmark local public GET routes only
        env:
          START_COMMAND: ${{ inputs.start-command }}
          LOAD_COMMAND: ${{ inputs.load-command }}
        run: |
          set -euo pipefail
          node -e "require('node:fs').rmSync('artifacts/load-test-report.json', {force: true})"
          setsid bash -euo pipefail -c "$START_COMMAND" > "$RUNNER_TEMP/isolated-load-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 -- "-$server_pid" 2>/dev/null; then break; fi
              sleep 0.1
            done
            kill -KILL -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo '::error::Isolated application server exited before readiness'
              cat "$RUNNER_TEMP/isolated-load-server.log"
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/api/health > /dev/null
          set +e
          bash -euo pipefail -c "$LOAD_COMMAND"
          load_status=$?
          node --input-type=module - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/load-test-report.json', 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const finite = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
          const integer = value => Number.isSafeInteger(value) && value >= 0;
          assert(report.mode === 'local-read-only' && report.target === 'http://127.0.0.1:3000', 'Non-local load report');
          assert(JSON.stringify(report.publicPaths) === JSON.stringify(['/', '/pricing', '/api/health']), 'Unexpected routes');
          assert(report.thresholds?.maxErrorPercent === 1 && report.thresholds?.maxP95Ms === 15000, 'Changed budgets');
          assert(Array.isArray(report.results) && report.results.length === 2, 'Missing load stages');
          const rows = [];
          let passed = true;
          for (const [index, x] of report.results.entries()) {
            assert(x.concurrency === [100, 200][index] && x.rounds === 3 && x.requests === x.concurrency * 3, 'Incomplete stage');
            assert(integer(x.successes) && integer(x.failed) && x.successes + x.failed === x.requests, 'Invalid response counts');
            const errorPercent = 100 * x.failed / x.requests;
            assert(finite(x.errorPercent) && x.errorPercent === Number(errorPercent.toFixed(2)), 'Inconsistent error rate');
            assert(finite(x.elapsedMs) && x.elapsedMs > 0 && finite(x.requestsPerSecond) && x.requestsPerSecond > 0, 'Invalid throughput');
            if (x.successes > 0) {
              assert([x.p50Ms, x.p95Ms, x.p99Ms].every(finite) && x.p50Ms <= x.p95Ms && x.p95Ms <= x.p99Ms, 'Invalid latency metrics');
            } else {
              assert(x.p50Ms === null && x.p95Ms === null && x.p99Ms === null, 'Invalid empty latencies');
            }
            const stagePassed = errorPercent <= 1 && x.p95Ms !== null && x.p95Ms <= 15000;
            assert(typeof x.passed === 'boolean' && x.passed === stagePassed, 'PASS flag contradicts measured budgets');
            passed &&= stagePassed;
            rows.push(`| ${x.concurrency} | ${x.requests} | ${x.errorPercent} | ${x.p95Ms ?? '-'} | ${x.p99Ms ?? '-'} | ${x.requestsPerSecond} | ${stagePassed ? 'PASS' : 'FAIL'} |`);
          }
          console.log('## Local read-only HTTP load QA\nNo production capacity claim; no live database or messaging traffic.');
          console.log('| Virtual users | Requests | Error % | P95 (ms) | P99 (ms) | Req/s | Result |\n|---:|---:|---:|---:|---:|---:|---|');
          console.log(rows.join('\n'));
          if (!passed) process.exitCode = 1;
          NODE
          summary_status=$?
          set -e
          if (( load_status != 0 || summary_status != 0 )); then exit 1; fi
      - name: Confirm isolated server stopped
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          let running = false;
          try {
            await fetch('http://127.0.0.1:3000/api/health', {redirect: 'manual', signal: AbortSignal.timeout(2000)});
            running = true;
          } catch {}
          if (running) throw new Error('Isolated application server was not stopped');
          NODE
      - name: Upload results and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-load-qa-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/artifacts/load-test-report.json
            ${{ runner.temp }}/isolated-load-server.log
          if-no-files-found: warn
          retention-days: 14

name: Reusable Full Dependency Advisory Watch
on:
  workflow_call:
    inputs:
      install-command:
        type: string
        required: true
      audit-command:
        type: string
        required: true
      node-version:
        type: string
        default: '24'
      package-manager:
        type: string
        default: 'npm'
      working-directory:
        type: string
        default: '.'
permissions:
  contents: read
jobs:
  audit:
    name: Security / strict advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.package-manager == 'pnpm'
        with:
          run_install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: inputs.package-manager == 'bun'
      - name: Configure Yarn Corepack
        if: inputs.package-manager == 'yarn'
        run: corepack enable
      - name: Require strict dependency audit
        env:
          INSTALL: ${{ inputs.install-command }}
          AUDIT: ${{ inputs.audit-command }}
        run: |
          set -euo pipefail
          [[ -n "$INSTALL" && -n "$AUDIT" ]] || { echo '::error::Locked install and strict audit are required'; exit 1; }
      - name: Locked install
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Audit all declared dependencies
        env:
          COMMAND: ${{ inputs.audit-command }}
        run: bash -euo pipefail -c "$COMMAND"

name: Hub guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Hub / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: YAML parser
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Validate catalog and workflows
        run: python scripts/validate.py
      - name: Actionlint v1.7.12 (verified release SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Tests (including mock GitHub API attack simulations)
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q scripts tests
  smoke-node:
    name: Hub / reusable Node smoke
    uses: ./.github/workflows/node-ci.yml
    with:
      node-version: '22'
      package-manager: npm
      working-directory: fixtures/node-smoke
      install-command: npm ci --ignore-scripts
      lint-command: npm run lint
      typecheck-command: npm run typecheck
      test-command: npm test
      build-command: npm run build
  smoke-python:
    name: Hub / reusable Python smoke
    uses: ./.github/workflows/python-ci.yml
    with:
      python-version: '3.12'
      install-command: python -m pip install 'PyYAML==6.0.3'
      lint-command: python -m compileall -q scripts tests
      test-command: python -m unittest discover -s tests -v

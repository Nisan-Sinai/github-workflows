name: Reusable Production Integrity Verification
on:
  workflow_call:
    inputs:
      production-url:
        type: string
        required: true
      verify-command:
        type: string
        required: true
      expected-sha:
        type: string
        required: true
      node-version:
        type: string
        default: '24'
permissions:
  contents: read
jobs:
  production:
    name: Production / verify exact release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Validate release verification inputs
        env:
          PRODUCTION_URL: ${{ inputs.production-url }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          let url;
          try { url = new URL(process.env.PRODUCTION_URL); }
          catch { throw new Error('Invalid production URL'); }
          if (url.protocol !== 'https:' || !url.hostname || url.username || url.password) {
            throw new Error('Production URL must use HTTPS without embedded credentials');
          }
          if (!/^[0-9a-fA-F]{40}$/.test(process.env.EXPECTED_SHA ?? '')) {
            throw new Error('Expected release SHA must be a full Git SHA');
          }
          if (!process.env.VERIFY_COMMAND?.trim()) {
            throw new Error('A nonblank release-aware verification command is required');
          }
          NODE
      - name: Assert public site serves exact expected release
        env:
          PRODUCTION_URL: ${{ inputs.production-url }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        shell: bash
        run: bash -euo pipefail -c "$VERIFY_COMMAND"

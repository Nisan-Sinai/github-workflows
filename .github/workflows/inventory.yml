name: Public policy drift report
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
concurrency:
  group: public-policy-inventory
  cancel-in-progress: true
jobs:
  audit:
    name: Inventory / read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read public GitHub settings (no writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_public.py

name: Public policy drift report
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: Inventory / read-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read public GitHub settings (no writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_public.py

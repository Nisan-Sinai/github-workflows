name: Reusable Node CI
on:
  workflow_call:
    inputs:
      package-manager:
        type: string
        default: npm
      node-version:
        type: string
        default: '22'
      working-directory:
        type: string
        default: '.'
      install-command:
        type: string
        required: true
      lint-command:
        type: string
        default: ''
      typecheck-command:
        type: string
        default: ''
      test-command:
        type: string
        default: ''
      build-command:
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 40
permissions:
  contents: read
jobs:
  verify:
    name: Node / verify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
        with:
          run_install: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: inputs.package-manager == 'bun'
      - name: Configure Yarn Corepack
        if: inputs.package-manager == 'yarn'
        run: corepack enable
      - name: Validate caller commands
        env:
          INSTALL: ${{ inputs.install-command }}
          LINT: ${{ inputs.lint-command }}
          TYPECHECK: ${{ inputs.typecheck-command }}
          TEST: ${{ inputs.test-command }}
          BUILD: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          test -n "$INSTALL" || { echo '::error::install-command is required'; exit 1; }
          if [[ -z "$LINT" && -z "$TYPECHECK" && -z "$TEST" && -z "$BUILD" ]]; then
            echo '::error::At least one verification command is required.'
            exit 1
          fi
      - name: Install locked dependencies
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Lint
        if: inputs.lint-command != ''
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Typecheck
        if: inputs.typecheck-command != ''
        env:
          COMMAND: ${{ inputs.typecheck-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Unit tests
        if: inputs.test-command != ''
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: inputs.build-command != ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"

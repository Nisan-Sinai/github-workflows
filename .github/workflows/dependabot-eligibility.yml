name: Reusable Dependabot eligibility gate
on:
  workflow_call:
    outputs:
      eligible:
        description: 'Whether the triggering PR is a minor or patch Dependabot update'
        value: ${{ jobs.check.outputs.eligible }}
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    name: Dependabot / eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
    steps:
      - name: Verify source and update type
        id: decide
        # IMPORTANT: the metadata action needs the caller workflow to be run
        # on a PR from Dependabot. This reusable workflow NEVER merges a PR.
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]]; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Read official Dependabot metadata
        if: steps.decide.outputs.verified == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Set eligible flag for minor/patch only
        id: classify
        env:
          VERIFIED: ${{ steps.decide.outputs.verified }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [[ "$VERIFIED" != "true" ]]; then
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo 'eligible=true' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'eligible=false' >> "$GITHUB_OUTPUT" ;;
          esac

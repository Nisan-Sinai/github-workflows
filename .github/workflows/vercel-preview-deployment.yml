name: Reusable Verified Vercel Preview Deployment
on:
  workflow_call:
    inputs:
      vercel-context:
        description: 'Exact status context (e.g. Vercel or Vercel – web)'
        type: string
        required: true
      expected-project-path:
        description: 'Expected vercel.com/<team>/<project>/ prefix without scheme'
        type: string
        required: true
      timeout-seconds:
        type: number
        default: 720
permissions:
  contents: read
  statuses: read
jobs:
  verify-preview:
    name: Deploy / verified Vercel Preview
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      statuses: read
      deployments: write
    steps:
      - name: Reject non-PR or untrusted fork contexts (never silently skip a required gate)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          echo '::error::This required Vercel verification must run on a same-repository pull request'
          exit 1
      - name: Validate genuine Vercel result and register Preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          CONTEXT: ${{ inputs.vercel-context }}
          PROJECT_PATH: ${{ inputs.expected-project-path }}
          TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          head = os.environ['EXPECTED_HEAD_SHA']
          context = os.environ['CONTEXT']
          project = os.environ['PROJECT_PATH'].strip('/')
          url_prefix = f'https://vercel.com/{project}/'
          if not re.fullmatch(r'[0-9a-fA-F]{40}', head):
              sys.exit('::error::Invalid PR head SHA')
          if not (context == 'Vercel' or context.startswith('Vercel – ')):
              sys.exit('::error::Unexpected Vercel status context')
          if not re.fullmatch(r'[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+', project):
              sys.exit('::error::Expected Vercel project path must be <team>/<project>')

          base = os.environ['API_URL'].rstrip('/')
          token = os.environ['GH_TOKEN']
          def api(path, method='GET', body=None):
              raw = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, raw,
                  headers={'Accept': 'application/vnd.github+json',
                           'Authorization': f'Bearer {token}',
                           'X-GitHub-Api-Version': '2022-11-28',
                           **({'Content-Type': 'application/json'} if raw else {})},
                  method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as result:
                      return json.load(result)
              except urllib.error.HTTPError as error:
                  sys.exit(f'::error::GitHub API {method} failed ({error.code})')

          deadline = time.monotonic() + min(840, max(30, int(os.environ['TIMEOUT_SECONDS'])))
          verified_dashboard = ''
          while time.monotonic() < deadline:
              # Status endpoint returns newest first; never trust stale successes.
              entries = api(f'/repos/{repo}/commits/{head}/statuses?per_page=100')
              match = next((item for item in entries if item.get('context') == context), None)
              if match is not None:
                  sender = (match.get('creator') or {}).get('login')
                  dashboard = match.get('target_url') or ''
                  state = match.get('state')
                  if sender != 'vercel[bot]' or not dashboard.startswith(url_prefix):
                      sys.exit(f'::error::{context} has an unverified sender or project')
                  if state in ('failure', 'error'):
                      sys.exit(f'::error::{context} failed')
                  if state == 'success':
                      verified_dashboard = dashboard
                      break
              print(f'Waiting for verified {context} on exact head {head}', flush=True)
              time.sleep(15)
          if not verified_dashboard:
              sys.exit('::error::No successful Vercel Preview for PR head')

          # environment: "Preview" — the GitHub Deployment is recorded only
          # after the real Vercel status is verified on the precise PR commit.
          deployment = api(f'/repos/{repo}/deployments', 'POST', {
              'ref': head, 'environment': 'Preview',
              'auto_merge': False, 'required_contexts': [context],
              'transient_environment': True, 'production_environment': False,
              'description': 'Verified real Vercel Preview for this exact PR head'})
          ident = deployment['id']
          api(f'/repos/{repo}/deployments/{ident}/statuses', 'POST', {
              'state': 'success', 'environment_url': verified_dashboard,
              'description': 'Verified Vercel status on exact PR head',
              'auto_inactive': True})
          print(f'Recorded Vercel-backed Preview deployment {ident} on {head}')
          PY

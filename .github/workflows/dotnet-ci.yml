name: Reusable .NET CI
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      dotnet-version:
        type: string
        default: '8.0.x'
      runner:
        type: string
        default: ubuntu-24.04
      run-tests:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    name: .NET / verify
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore
        env:
          PROJECT: ${{ inputs.project }}
        run: dotnet restore "$PROJECT"
      - name: Build
        env:
          PROJECT: ${{ inputs.project }}
        run: dotnet build "$PROJECT" --configuration Release --no-restore
      - name: Tests
        if: inputs.run-tests
        env:
          PROJECT: ${{ inputs.project }}
        run: dotnet test "$PROJECT" --configuration Release --no-build

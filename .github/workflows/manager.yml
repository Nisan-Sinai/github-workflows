name: Central repository manager
on:
  push:
    branches: [main]
    paths:
      - default.json
      - renovate/global.json
      - .github/workflows/manager.yml
  schedule:
    # Six passes let strict, rebased PRs converge during one Monday window.
    - cron: '0,30 3-5 * * 1'
  workflow_dispatch:
    inputs:
      ignore_schedule:
        description: Allow a manual verification run outside the Monday window
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: central-repository-manager
  cancel-in-progress: false
jobs:
  renovate:
    name: Manager / dependency updates
    if: github.repository == 'Nisan-Sinai/github-workflows' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: central-manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint repository-scoped GitHub App token
        id: manager-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MANAGER_CLIENT_ID }}
          private-key: ${{ secrets.MANAGER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.MANAGER_REPOSITORIES }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - name: Run pinned central dependency manager
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: renovate/global.json
          renovate-image: renovate/renovate@sha256:d4821e4630896b093a9a4f2f0f6e3fa68c707cc54fb3a403762ede943930f39b # 44.156.1
          token: ${{ steps.manager-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_FORCE: ${{ (github.event_name == 'push' || inputs.ignore_schedule) && '{"schedule":null}' || '' }}

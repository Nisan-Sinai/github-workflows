name: Central repository manager
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: central-repository-manager
  cancel-in-progress: false
jobs:
  renovate:
    name: Manager / dependency updates
    if: github.repository == 'Nisan-Sinai/github-workflows' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint repository-scoped GitHub App token
        id: manager-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MANAGER_APP_ID }}
          private-key: ${{ secrets.MANAGER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Run pinned central dependency manager
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: renovate/global.json
          renovate-image: renovate/renovate@sha256:d4821e4630896b093a9a4f2f0f6e3fa68c707cc54fb3a403762ede943930f39b # 44.156.1
          token: ${{ steps.manager-token.outputs.token }}
        env:
          LOG_LEVEL: info

name: Reusable Security CI
on:
  workflow_call:
    inputs:
      ecosystem:
        type: string
        default: 'none'
      package-manager:
        type: string
        default: npm
      working-directory:
        type: string
        default: '.'
      audit-command:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  secrets:
    name: Security / secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependencies:
    name: Security / dependency audit
    if: inputs.ecosystem != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.ecosystem == 'node'
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.ecosystem == 'node' && inputs.package-manager == 'pnpm'
        with:
          run_install: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.ecosystem == 'python'
        with:
          python-version: '3.12'
      - name: Dependency audit
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          PM: ${{ inputs.package-manager }}
          COMMAND: ${{ inputs.audit-command }}
        run: |
          set -euo pipefail
          if [[ -n "$COMMAND" ]]; then
            bash -euo pipefail -c "$COMMAND"
          elif [[ "$ECOSYSTEM" == 'node' && "$PM" == 'npm' ]]; then
            npm audit --omit=dev --audit-level=high
          elif [[ "$ECOSYSTEM" == 'node' && "$PM" == 'pnpm' ]]; then
            pnpm audit --prod --audit-level=high
          elif [[ "$ECOSYSTEM" == 'python' ]]; then
            python -m pip install pip-audit
            python -m pip_audit
          else
            echo '::error::Unsupported ecosystem / package manager without explicit audit-command.'
            exit 1
          fi
